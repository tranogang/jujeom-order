<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>주방 · 조리 현황</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --sub:#f5f8fc; --line:#dde6f1;
    --txt:#141a22; --muted:#6b7684;
    --blue:#0b4da2; --grass:#1e7a46; --red:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit}

  header{flex:0 0 auto;display:flex;align-items:center;gap:16px;
         padding:14px 22px;border-bottom:4px solid var(--blue);background:#fff}
  .ball{width:30px;height:30px;flex:0 0 auto}
  .ttl{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .ttl small{display:block;font-size:11px;font-weight:700;color:var(--blue);
             letter-spacing:.14em;margin-top:2px}
  .spacer{flex:1}
  .stat{text-align:center;padding:0 16px;border-left:1px solid var(--line)}
  .stat .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;
           color:var(--blue)}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .stat.done .n{color:var(--grass)}
  .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
         color:var(--txt);padding-left:16px;border-left:1px solid var(--line)}
  .conn{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}

  main{flex:1;overflow-y:auto;padding:16px;min-height:0;
       display:grid;gap:14px;align-content:start;
       grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  main::-webkit-scrollbar{width:9px}
  main::-webkit-scrollbar-thumb{background:#c5d2e2;border-radius:5px}

  .card{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--blue);
        border-radius:14px;padding:16px;display:flex;flex-direction:column}
  .card.late{border-left-color:var(--red);background:#fff5f5}
  .card.fresh{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}

  .c-top{display:flex;align-items:center;gap:12px}
  .table{background:var(--blue);color:#fff;font-size:22px;font-weight:800;
         min-width:62px;height:48px;border-radius:11px;display:grid;place-items:center;padding:0 10px}
  .card.late .table{background:var(--red)}
  .who{font-size:14px;color:var(--muted);font-weight:600}
  .no{font-size:11px;color:#9aa7b8;margin-top:2px}
  .elapsed{margin-left:auto;text-align:right}
  .elapsed .m{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .elapsed .s{font-size:11px;color:var(--muted)}
  .card.late .elapsed .m{color:var(--red)}

  .items{margin:16px 0 6px;display:flex;flex-direction:column;gap:9px}
  .it{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;line-height:1.25}
  .it .q{background:#e4eefc;border:1px solid #cddffa;border-radius:8px;
         min-width:44px;text-align:center;padding:4px 8px;font-size:20px;font-weight:800;
         color:var(--blue);flex:0 0 auto}

  .act{width:100%;margin-top:auto;padding-top:16px}
  .act button{width:100%;height:58px;border:0;border-radius:12px;
              font-size:19px;font-weight:800;color:#fff;background:var(--grass);
              box-shadow:0 3px 0 #14532d}
  .act button:active{transform:translateY(2px);box-shadow:0 1px 0 #14532d}

  .empty{grid-column:1/-1;display:grid;place-items:center;padding:80px 20px;
         color:#9aa7b8;font-size:16px;text-align:center;line-height:1.8}

  footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--sub);
         padding:10px 16px;display:flex;align-items:center;gap:10px;overflow-x:auto}
  footer .lbl{font-size:12px;color:var(--muted);font-weight:700;flex:0 0 auto}
  .undo{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;
        border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px}
  .undo b{font-weight:800}
  .undo button{border:0;background:var(--sub);border-radius:999px;padding:5px 10px;
               font-size:12px;font-weight:700;color:var(--blue)}

  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);
         background:var(--txt);color:#fff;font-weight:800;font-size:15px;
         padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;
         transition:opacity .25s;z-index:50}
  .toast.on{opacity:1}

  .setup{position:fixed;inset:0;background:#fff;display:none;place-items:center;
         padding:30px;z-index:60;text-align:center}
  .setup.on{display:grid}
  .uid{margin-top:16px;background:var(--sub);border:1px solid var(--line);border-radius:10px;
       padding:14px;font-size:15px;font-weight:800;color:var(--blue);word-break:break-all}

  @media (max-width:640px){
    header{padding:12px 14px;gap:10px}
    .ttl{font-size:17px}
    .clock{font-size:20px;padding-left:10px}
    .stat{padding:0 10px}
    main{padding:12px;grid-template-columns:1fr}
    .it{font-size:20px}
  }
</style>
</head>
<body>

<header>
  <svg class="ball" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#fff" stroke="#c9d6e6" stroke-width="2"/>
    <path d="M8 7q7 13 0 26M32 7q-7 13 0 26" stroke="#d32f2f" stroke-width="2.6" fill="none"/>
  </svg>
  <div class="ttl">주방 조리 현황<small>KITCHEN DISPLAY</small></div>
  <div class="spacer"></div>
  <div class="stat"><div class="n" id="nCook">0</div><div class="l">조리할 주문</div></div>
  <div class="stat done"><div class="n" id="nDone">0</div><div class="l">오늘 완료</div></div>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="conn" id="conn">연결 중…</div>
  </div>
</header>

<main id="list"></main>

<footer id="foot" style="display:none">
  <span class="lbl">방금 완료</span>
  <div id="undoBox" style="display:flex;gap:8px"></div>
</footer>

<div class="toast" id="toast"></div>

<div class="setup" id="setup">
  <div>
    <h2>주방 화면 권한이 필요해요</h2>
    <p style="color:#6b7684">아래 번호를 알려주시면 등록해 드립니다.</p>
    <div class="uid" id="uidBox">확인 중…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRtSHfavnWGNAgLl9Agxjql9dc74cbpKg",
  authDomain: "mobile-jujeom.firebaseapp.com",
  databaseURL: "https://mobile-jujeom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobile-jujeom",
  storageBucket: "mobile-jujeom.firebasestorage.app",
  messagingSenderId: "625669561757",
  appId: "1:625669561757:web:5e7fbaf2b77fd9170d2374"
};

/** 이 분을 넘기면 카드가 빨갛게 */
const LATE_MIN = 15;
/** 되돌리기 버튼을 남겨두는 개수 */
const UNDO_KEEP = 4;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let orders = [];
let recent = [];            // 방금 완료 처리한 주문 (되돌리기용)
const seen = new Set();
let firstLoad = true;

function tickClock() {
  const d = new Date();
  $("clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tickClock();
setInterval(tickClock, 10000);
setInterval(render, 20000);   // 경과 시간 갱신

signInAnonymously(auth).catch(e => console.error(e));
onAuthStateChanged(auth, user => {
  if (!user) return;
  $("uidBox").textContent = user.uid;
  onValue(ref(db, "orders"), snap => {
    $("conn").textContent = "실시간 연결됨";
    $("setup").classList.remove("on");
    const v = snap.val() || {};
    orders = Object.entries(v).map(([id, o]) => ({ ...o, id }));
    render();
    firstLoad = false;
  }, err => {
    console.error(err);
    $("conn").textContent = "권한 없음";
    $("setup").classList.add("on");
  });
});

/** 주방이 만들어야 하는 주문 — 입금 확인됐고 아직 안 나간 것 */
function toCook(o) { return o.status === "PAID" || o.status === "COOKING"; }

function render() {
  const list = orders.filter(toCook).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const done = orders.filter(o => o.status === "SERVED").length;

  $("nCook").textContent = list.length;
  $("nDone").textContent = done;

  if (!list.length) {
    $("list").innerHTML =
      `<div class="empty">조리할 주문이 없습니다<br>
        <span style="font-size:14px">새 주문이 들어오면 소리로 알려드려요</span></div>`;
  } else {
    $("list").innerHTML = list.map(o => {
      const min = Math.floor((Date.now() - (o.createdAt || Date.now())) / 60000);
      const late = min >= LATE_MIN;
      const fresh = !seen.has(o.id) && !firstLoad;
      const items = (o.items || []).map(i =>
        `<div class="it"><span class="q">${i.qty}</span><span>${i.name}</span></div>`).join("");
      return `<div class="card ${late ? "late" : ""} ${fresh ? "fresh" : ""}" data-id="${o.id}">
        <div class="c-top">
          <div class="table">${o.tableNo}번</div>
          <div>
            <div class="who">${o.depositorName || "-"}</div>
            <div class="no">주문번호 ${String(o.id).slice(-6).toUpperCase()}</div>
          </div>
          <div class="elapsed"><div class="m">${min}</div><div class="s">분 경과</div></div>
        </div>
        <div class="items">${items}</div>
        <div class="act"><button>완료</button></div>
      </div>`;
    }).join("");
  }

  if (!firstLoad && list.some(o => !seen.has(o.id))) beep();
  list.forEach(o => seen.add(o.id));

  renderUndo();
}

$("list").onclick = e => {
  const btn = e.target.closest(".act button");
  if (!btn) return;
  const id = btn.closest(".card").dataset.id;
  finish(id, orders.find(x => x.id === id));
};

async function finish(id, o) {
  try {
    await update(ref(db, "orders/" + id), { status: "SERVED", servedAt: Date.now() });
    recent.unshift({ id, table: o ? o.tableNo : "?", prev: o ? o.status : "PAID" });
    recent = recent.slice(0, UNDO_KEEP);
    seen.delete(id);
    toast((o ? o.tableNo + "번 " : "") + "완료");
    renderUndo();
  } catch (e) {
    console.error(e);
    toast("바꾸지 못했어요 — 권한을 확인해 주세요");
  }
}

function renderUndo() {
  if (!recent.length) { $("foot").style.display = "none"; return; }
  $("foot").style.display = "flex";
  $("undoBox").innerHTML = recent.map(r =>
    `<span class="undo"><b>${r.table}번</b>
      <button data-undo="${r.id}" data-prev="${r.prev}">되돌리기</button></span>`).join("");
}

$("undoBox").onclick = async e => {
  const b = e.target.closest("button[data-undo]");
  if (!b) return;
  const id = b.dataset.undo;
  try {
    await update(ref(db, "orders/" + id), { status: b.dataset.prev || "PAID", servedAt: null });
    recent = recent.filter(r => r.id !== id);
    toast("되돌렸습니다");
    renderUndo();
  } catch (err) {
    toast("되돌리지 못했어요");
  }
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1400);
}

function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.2, 0.4].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = [880, 1175, 1568][i];
      g.gain.setValueAtTime(0.001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.17);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.2);
    });
  } catch (e) {}
}

if ("wakeLock" in navigator) {
  const keep = () => navigator.wakeLock.request("screen").catch(() => {});
  keep();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keep();
  });
}
</script>
</body>
</html>
