<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>주방 · 조리 현황</title>
<style>
  :root{
    /* 흰색 유니폼 — 배경 흰색, 포인트 블루 */
    --board:#ffffff; --board2:#f5f8fc; --line:#dde6f1;
    --txt:#141a22; --muted:#6b7684;
    --blue:#0b4da2; --navy:#06306b; --grass:#1e7a46;
    --amber:#c2410c; --red:#dc2626; --seam:#d32f2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--board);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit}

  /* ── 전광판 헤더 ── */
  header{flex:0 0 auto;display:flex;align-items:center;gap:16px;
         padding:14px 22px;border-bottom:4px solid var(--blue);background:#fff}
  .ball{width:30px;height:30px;flex:0 0 auto}
  .ttl{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .ttl small{display:block;font-size:11px;font-weight:700;color:var(--blue);
             letter-spacing:.14em;margin-top:2px}
  .spacer{flex:1}
  .stat{text-align:center;padding:0 14px;border-left:1px solid var(--line)}
  .stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .stat.wait .n{color:var(--blue)}
  .stat.cook .n{color:var(--amber)}
  .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
         color:var(--blue);padding-left:16px;border-left:1px solid var(--line)}
  .conn{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}

  /* ── 보드 ── */
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
       min-height:0}
  section{background:var(--board);display:flex;flex-direction:column;min-height:0}
  .sec-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;
            background:var(--board2);border-bottom:1px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%}
  .sec-head b{font-size:15px;letter-spacing:.02em}
  .sec-head .cnt{margin-left:auto;font-size:15px;font-weight:800;color:var(--muted);
                 font-variant-numeric:tabular-nums}
  .cards{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-thumb{background:#c5d2e2;border-radius:4px}

  .card{background:var(--board2);border:1px solid var(--line);border-radius:14px;
        padding:16px 16px 14px;border-left:6px solid var(--blue)}
  .card.cooking{border-left-color:var(--amber)}
  .card.late{border-left-color:var(--red);background:#fff1f1}
  .card.new{animation:flash 1.1s ease-in-out 3}
  @keyframes flash{50%{background:#e4eefc}}

  .c-top{display:flex;align-items:center;gap:10px}
  .table{background:var(--blue);color:#fff;font-size:20px;font-weight:800;
         min-width:56px;height:44px;border-radius:10px;display:grid;place-items:center;padding:0 10px}
  .card.cooking .table{background:var(--amber);color:#fff}
  .card.late .table{background:var(--red)}
  .who{font-size:15px;font-weight:700}
  .no{font-size:11px;color:var(--muted);margin-top:2px}
  .elapsed{margin-left:auto;text-align:right}
  .elapsed .m{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .elapsed .s{font-size:11px;color:var(--muted)}
  .card.late .elapsed .m{color:var(--red)}

  .items{margin:14px 0 4px;display:flex;flex-direction:column;gap:7px}
  .it{display:flex;align-items:baseline;gap:10px;font-size:19px;font-weight:700;line-height:1.3}
  .it .q{background:#e4eefc;border:1px solid #cddffa;border-radius:7px;
         min-width:38px;text-align:center;padding:3px 6px;font-size:17px;font-weight:800;
         color:var(--blue);flex:0 0 auto}

  .act{width:100%;margin-top:14px;height:52px;border:0;border-radius:11px;
       font-size:17px;font-weight:800;color:#fff;background:var(--grass);
       box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .act.start{background:var(--blue)}
  .act:active{transform:translateY(2px)}

  .empty{flex:1;display:grid;place-items:center;color:#9aa7b8;font-size:15px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
         background:var(--txt);color:#fff;font-weight:800;font-size:15px;
         padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;
         transition:opacity .25s;z-index:50}
  .toast.on{opacity:1}

  .setup{position:fixed;inset:0;background:var(--board);display:none;
         place-items:center;padding:30px;z-index:60;text-align:center}
  .setup.on{display:grid}
  .setup .box{max-width:520px}
  .setup h2{font-size:22px;margin:0 0 12px}
  .setup p{color:var(--muted);font-size:15px;line-height:1.7}
  .uid{margin-top:16px;background:var(--board2);border:1px solid var(--line);border-radius:10px;
       padding:14px;font-size:15px;font-weight:800;color:var(--blue);word-break:break-all}

  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .ttl{font-size:17px}
    .clock,.stat .n{font-size:20px}
    .it{font-size:17px}
  }
</style>
</head>
<body>

<header>
  <svg class="ball" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#fff" stroke="#c9d6e6" stroke-width="2"/>
    <path d="M8 7q7 13 0 26M32 7q-7 13 0 26" stroke="#d32f2f" stroke-width="2.6" fill="none"/>
  </svg>
  <div class="ttl">주방 조리 현황<small>KITCHEN DISPLAY</small></div>
  <div class="spacer"></div>
  <div class="stat wait"><div class="n" id="nWait">0</div><div class="l">조리 대기</div></div>
  <div class="stat cook"><div class="n" id="nCook">0</div><div class="l">조리 중</div></div>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="conn" id="conn">연결 중…</div>
  </div>
</header>

<main>
  <section>
    <div class="sec-head">
      <span class="dot" style="background:#0b4da2"></span>
      <b>조리 대기</b><span class="cnt" id="cWait">0</span>
    </div>
    <div class="cards" id="listNew"></div>
  </section>
  <section>
    <div class="sec-head">
      <span class="dot" style="background:#c2410c"></span>
      <b>조리 중</b><span class="cnt" id="cCook">0</span>
    </div>
    <div class="cards" id="listCook"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="setup" id="setup">
  <div class="box">
    <h2>주방 화면 권한이 필요해요</h2>
    <p>아래 주방 기기 번호를 Claude에게 알려주시면<br>데이터베이스 규칙에 등록해 드립니다.<br>
       한 번만 하면 이 기기에서는 계속 열립니다.</p>
    <div class="uid" id="uidBox">확인 중…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRtSHfavnWGNAgLl9Agxjql9dc74cbpKg",
  authDomain: "mobile-jujeom.firebaseapp.com",
  databaseURL: "https://mobile-jujeom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobile-jujeom",
  storageBucket: "mobile-jujeom.firebasestorage.app",
  messagingSenderId: "625669561757",
  appId: "1:625669561757:web:5e7fbaf2b77fd9170d2374"
};

/** 이 분을 넘기면 카드가 빨갛게 — 늦은 주문 눈에 띄게 */
const LATE_MIN = 15;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let orders = [];
const seen = new Set();      // 이미 본 주문 — 새로 뜰 때만 소리
let firstLoad = true;

/* ── 시계 ── */
function tickClock() {
  const d = new Date();
  $("clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tickClock();
setInterval(tickClock, 10000);
setInterval(render, 20000);   // 경과 시간 갱신

/* ── 로그인 ── */
signInAnonymously(auth).catch(e => console.error(e));
onAuthStateChanged(auth, user => {
  if (!user) return;
  $("uidBox").textContent = user.uid;
  watch();
});

/* ── 주문 구독 ── */
function watch() {
  onValue(ref(db, "orders"), snap => {
    $("conn").textContent = "실시간 연결됨";
    $("setup").classList.remove("on");
    const v = snap.val() || {};
    orders = Object.entries(v).map(([id, o]) => ({ ...o, id }));
    render();
    firstLoad = false;
  }, err => {
    console.error(err);
    $("conn").textContent = "권한 없음";
    $("setup").classList.add("on");
  });
}

/* ── 그리기 ── */
function render() {
  const mk = s => orders.filter(o => o.status === s)
                        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const news = mk("PAID");
  const cooks = mk("COOKING");

  $("nWait").textContent = news.length;
  $("nCook").textContent = cooks.length;
  $("cWait").textContent = news.length;
  $("cCook").textContent = cooks.length;

  paint($("listNew"), news, false);
  paint($("listCook"), cooks, true);

  // 새 주문이 뜨면 소리로 알린다
  if (!firstLoad) {
    for (const o of news) {
      if (!seen.has(o.id)) { beep(); break; }
    }
  }
  news.forEach(o => seen.add(o.id));
}

function paint(box, list, cooking) {
  if (!list.length) {
    box.innerHTML = `<div class="empty">${cooking ? "조리 중인 주문이 없습니다" : "새 주문을 기다리는 중"}</div>`;
    return;
  }
  box.innerHTML = list.map(o => {
    const min = Math.floor((Date.now() - (o.createdAt || Date.now())) / 60000);
    const late = min >= LATE_MIN;
    const items = (o.items || []).map(i =>
      `<div class="it"><span class="q">${i.qty}</span><span>${i.name}</span></div>`).join("");
    return `<div class="card ${cooking ? "cooking" : ""} ${late ? "late" : ""}" data-id="${o.id}">
      <div class="c-top">
        <div class="table">${o.tableNo}번</div>
        <div>
          <div class="who">${o.depositorName || "-"}</div>
          <div class="no">주문번호 ${String(o.id).slice(-6).toUpperCase()}</div>
        </div>
        <div class="elapsed"><div class="m">${min}</div><div class="s">분 경과</div></div>
      </div>
      <div class="items">${items}</div>
      <button class="act ${cooking ? "" : "start"}" data-act="${cooking ? "SERVED" : "COOKING"}">
        ${cooking ? "전달 완료" : "조리 시작"}
      </button>
    </div>`;
  }).join("");

  box.onclick = e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const card = btn.closest(".card");
    setStatus(card.dataset.id, btn.dataset.act);
  };
}

async function setStatus(id, status) {
  const patch = { status };
  if (status === "SERVED") patch.servedAt = Date.now();
  try {
    await update(ref(db, "orders/" + id), patch);
    toast(status === "SERVED" ? "전달 완료" : "조리 시작");
  } catch (e) {
    console.error(e);
    toast("바꾸지 못했어요 — 권한을 확인해 주세요");
  }
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1400);
}

/* 새 주문 알림음 */
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.2, 0.4].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = [880, 1175, 1568][i];
      g.gain.setValueAtTime(0.001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.17);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.2);
    });
  } catch (e) {}
}

// 화면이 꺼지지 않게 (지원하는 기기에서만)
if ("wakeLock" in navigator) {
  const keep = () => navigator.wakeLock.request("screen").catch(() => {});
  keep();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keep();
  });
}
</script>
</body>
</html>
