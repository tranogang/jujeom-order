<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>매출 · 판매 분석</title>
<style>
  :root{
    --board:#ffffff; --board2:#f5f8fc; --line:#dde6f1;
    --txt:#141a22; --muted:#6b7684;
    --blue:#0b4da2; --grass:#1e7a46; --amber:#c2410c; --red:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--board);color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       padding-bottom:40px}
  button{font-family:inherit}

  header{display:flex;align-items:center;gap:14px;padding:16px 20px;
         background:#fff;border-bottom:4px solid var(--blue);
         position:sticky;top:0;z-index:10}
  .ball{width:28px;height:28px;flex:0 0 auto}
  .ttl{font-size:20px;font-weight:800}
  .ttl small{display:block;font-size:11px;font-weight:700;color:var(--blue);
             letter-spacing:.14em;margin-top:2px}
  .spacer{flex:1}
  .live{font-size:11px;color:var(--muted)}

  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 0}

  /* 큰 숫자 카드 */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--board2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .n{font-size:27px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;
          letter-spacing:-.5px}
  .kpi.main .n{color:var(--blue);font-size:32px}
  .kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}

  h2{font-size:16px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:9px}
  h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue)}
  h2 .tail{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}

  table{width:100%;border-collapse:collapse;background:var(--board2);
        border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:#eef3fa;font-size:12px;color:var(--muted);font-weight:700}
  tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  td.rank{width:34px;color:var(--muted);font-weight:800}
  .barcell{position:relative;padding:0;height:6px}
  .barcell i{position:absolute;left:0;top:0;height:100%;background:var(--blue);display:block}

  .name-wrap{display:flex;align-items:center;gap:10px}
  .medal{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
         font-size:11px;font-weight:800;color:#0c1a2b;flex:0 0 auto}

  .cat{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .cat .c{background:var(--board2);border:1px solid var(--line);border-radius:12px;
          padding:12px 14px;flex:1;min-width:130px}
  .cat .c .l{font-size:12px;color:var(--muted)}
  .cat .c .n{font-size:19px;font-weight:800;margin-top:4px}

  .note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
  .empty{background:var(--board2);border:1px solid var(--line);border-radius:14px;
         padding:34px;text-align:center;color:var(--muted);font-size:14px}
  .setup{padding:40px 20px;text-align:center}
  .uid{margin-top:14px;background:var(--board2);border:1px solid var(--line);border-radius:10px;
       padding:14px;font-weight:800;color:var(--blue);word-break:break-all}
</style>
</head>
<body>

<header>
  <svg class="ball" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#fff" stroke="#c9d6e6" stroke-width="2"/>
    <path d="M8 7q7 13 0 26M32 7q-7 13 0 26" stroke="#d32f2f" stroke-width="2.6" fill="none"/>
  </svg>
  <div class="ttl">매출 · 판매 분석<small>BOX SCORE</small></div>
  <div class="spacer"></div>
  <div class="live" id="live">연결 중…</div>
</header>

<div class="wrap" id="wrap">
  <div class="kpis">
    <div class="kpi main">
      <div class="l">확정 매출</div>
      <div class="n" id="kSales">0원</div>
      <div class="sub" id="kSalesSub">실제 입금된 금액</div>
    </div>
    <div class="kpi">
      <div class="l">주문 수</div>
      <div class="n" id="kOrders">0</div>
      <div class="sub" id="kOrdersSub">입금 확인된 주문</div>
    </div>
    <div class="kpi">
      <div class="l">객단가</div>
      <div class="n" id="kAvg">0원</div>
      <div class="sub">주문 1건당 평균</div>
    </div>
    <div class="kpi">
      <div class="l">미수금</div>
      <div class="n" id="kDue">0원</div>
      <div class="sub" id="kDueSub">아직 안 들어온 금액</div>
    </div>
  </div>

  <h2>메뉴별 판매 <span class="tail" id="menuTail"></span></h2>
  <div id="menuBox"></div>

  <h2>카테고리 <span class="tail">추정</span></h2>
  <div class="cat" id="catBox"></div>

  <h2>테이블별 매출</h2>
  <div id="tableBox"></div>

  <h2>시간대별 주문</h2>
  <div id="hourBox"></div>

  <div class="note">
    확정 매출 = 입금이 확인된 금액만 (부분 입금은 들어온 만큼 포함, 취소 주문 제외).<br>
    메뉴별 판매는 입금 확인된 주문 기준입니다. 실시간으로 갱신돼요.
  </div>
</div>

<div class="setup" id="setup" style="display:none">
  <h2 style="justify-content:center">권한이 필요해요</h2>
  <p style="color:var(--muted)">아래 번호를 Claude에게 알려주시면 등록해 드립니다.</p>
  <div class="uid" id="uidBox">확인 중…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRtSHfavnWGNAgLl9Agxjql9dc74cbpKg",
  authDomain: "mobile-jujeom.firebaseapp.com",
  databaseURL: "https://mobile-jujeom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobile-jujeom",
  storageBucket: "mobile-jujeom.firebasestorage.app",
  messagingSenderId: "625669561757",
  appId: "1:625669561757:web:5e7fbaf2b77fd9170d2374"
};

/* 메뉴 이름 → 카테고리 (주문에는 카테고리가 안 담기므로 이름으로 추정) */
const CAT = {
  "사복주":"주류","청춘 블루":"주류","소주":"주류","맥주":"주류","막걸리":"주류",
  "골뱅이소면":"안주","계란말이":"안주","과일화채":"안주","마른안주 모둠":"안주","감자튀김":"안주",
  "콜라":"음료","사이다":"음료"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";

/** 매출로 잡는 주문인가 — 취소 제외 */
function counted(o) { return o.status !== "CANCELED"; }
/** 입금이 확인된 주문 (부분 입금 포함) */
function paidish(o) { return (o.paidAmount || 0) > 0; }

signInAnonymously(auth).catch(e => console.error(e));
onAuthStateChanged(auth, u => {
  if (!u) return;
  $("uidBox").textContent = u.uid;
  onValue(ref(db, "orders"), snap => {
    $("live").textContent = "실시간 갱신 중";
    $("setup").style.display = "none";
    $("wrap").style.display = "";
    render(Object.entries(snap.val() || {}).map(([id, o]) => ({ ...o, id })));
  }, err => {
    console.error(err);
    $("live").textContent = "권한 없음";
    $("wrap").style.display = "none";
    $("setup").style.display = "";
  });
});

function render(orders) {
  const live = orders.filter(counted);

  const sales = live.reduce((s, o) => s + (o.paidAmount || 0), 0);
  const done = live.filter(o => ["PAID","COOKING","SERVED"].includes(o.status));
  const due = live.reduce((s, o) => s + Math.max(0, (o.amount || 0) - (o.paidAmount || 0)), 0);

  $("kSales").textContent = won(sales);
  $("kOrders").textContent = done.length;
  $("kOrdersSub").textContent = "전체 주문 " + live.length + "건";
  $("kAvg").textContent = done.length ? won(sales / done.length) : "0원";
  $("kDue").textContent = won(due);
  $("kDueSub").textContent = live.filter(o => (o.amount||0) > (o.paidAmount||0)).length + "건 남음";

  // ── 메뉴별 ──
  const byMenu = new Map();
  let totalQty = 0;
  for (const o of live) {
    if (!paidish(o)) continue;               // 돈이 들어온 주문만 집계
    for (const it of (o.items || [])) {
      const k = it.name;
      const cur = byMenu.get(k) || { qty:0, amount:0 };
      cur.qty += it.qty || 0;
      cur.amount += (it.qty || 0) * (it.price || 0);
      byMenu.set(k, cur);
      totalQty += it.qty || 0;
    }
  }
  const menu = [...byMenu.entries()].map(([name, v]) => ({ name, ...v }))
                 .sort((a, b) => b.qty - a.qty || b.amount - a.amount);
  $("menuTail").textContent = totalQty ? "총 " + totalQty + "개" : "";

  if (!menu.length) {
    $("menuBox").innerHTML = `<div class="empty">아직 판매된 메뉴가 없습니다</div>`;
  } else {
    const max = menu[0].qty || 1;
    const medal = i => i===0 ? "#f5c04a" : i===1 ? "#b9c4d2" : i===2 ? "#cd7f32" : null;
    $("menuBox").innerHTML = `<table>
      <tr><th>순위</th><th>메뉴</th><th style="text-align:right">수량</th>
          <th style="text-align:right">금액</th><th style="text-align:right">비중</th></tr>
      ${menu.map((m, i) => {
        const c = medal(i);
        return `<tr>
          <td class="rank">${i+1}</td>
          <td><div class="name-wrap">
            ${c ? `<span class="medal" style="background:${c}">${i+1}</span>` : ""}
            <span>${m.name}</span></div></td>
          <td class="num">${m.qty}개</td>
          <td class="num">${won(m.amount)}</td>
          <td class="num" style="color:var(--muted)">${totalQty ? Math.round(m.qty/totalQty*100) : 0}%</td>
        </tr>
        <tr><td colspan="5" class="barcell"><i style="width:${m.qty/max*100}%"></i></td></tr>`;
      }).join("")}
    </table>`;
  }

  // ── 카테고리 ──
  const byCat = new Map();
  for (const m of menu) {
    const c = CAT[m.name] || "기타";
    const cur = byCat.get(c) || { qty:0, amount:0 };
    cur.qty += m.qty; cur.amount += m.amount;
    byCat.set(c, cur);
  }
  const cats = [...byCat.entries()].sort((a,b) => b[1].amount - a[1].amount);
  $("catBox").innerHTML = cats.length
    ? cats.map(([c, v]) => `<div class="c"><div class="l">${c} · ${v.qty}개</div>
        <div class="n">${won(v.amount)}</div></div>`).join("")
    : `<div class="empty" style="flex:1">데이터 없음</div>`;

  // ── 테이블별 ──
  const byTable = new Map();
  for (const o of live) {
    if (!paidish(o)) continue;
    const cur = byTable.get(o.tableNo) || { amount:0, n:0 };
    cur.amount += o.paidAmount || 0; cur.n += 1;
    byTable.set(o.tableNo, cur);
  }
  const tables = [...byTable.entries()].sort((a,b) => b[1].amount - a[1].amount);
  $("tableBox").innerHTML = tables.length ? `<table>
      <tr><th>테이블</th><th style="text-align:right">주문</th><th style="text-align:right">매출</th></tr>
      ${tables.map(([t, v]) => `<tr><td>${t}번</td>
        <td class="num">${v.n}건</td><td class="num">${won(v.amount)}</td></tr>`).join("")}
    </table>` : `<div class="empty">아직 매출이 없습니다</div>`;

  // ── 시간대별 ──
  const byHour = new Map();
  for (const o of live) {
    if (!o.createdAt) continue;
    const h = new Date(o.createdAt).getHours();
    const cur = byHour.get(h) || { n:0, amount:0 };
    cur.n += 1; cur.amount += o.paidAmount || 0;
    byHour.set(h, cur);
  }
  const hours = [...byHour.entries()].sort((a,b) => a[0]-b[0]);
  const hmax = Math.max(1, ...hours.map(([,v]) => v.n));
  $("hourBox").innerHTML = hours.length ? `<table>
      <tr><th>시간</th><th style="text-align:right">주문</th><th style="text-align:right">매출</th></tr>
      ${hours.map(([h, v]) => `<tr><td>${String(h).padStart(2,"0")}시</td>
          <td class="num">${v.n}건</td><td class="num">${won(v.amount)}</td></tr>
        <tr><td colspan="3" class="barcell"><i style="width:${v.n/hmax*100}%;background:var(--grass)"></i></td></tr>`).join("")}
    </table>` : `<div class="empty">아직 주문이 없습니다</div>`;
}
</script>
</body>
</html>
