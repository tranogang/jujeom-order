<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>주문하기</title>
<style>
  :root{
    /* 야구장 테마 — 팀 컬러 계열 (로고·엠블럼은 쓰지 않음) */
    --bg:#ffffff; --sub:#f2f6fb; --line:#e2e9f2;
    --text:#141a22; --muted:#6b7684;
    --accent:#0b4da2;        /* 라이온즈 블루 */
    --navy:#06306b;          /* 유니폼 네이비 */
    --accent-weak:#e4eefc;
    --grass:#1e7a46; --dirt:#c08a4e; --seam:#d32f2f;
    --board:#0c1a2b; --board-txt:#ffd54f;
    --ok:#1e7a46; --warn:#c2410c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  .top{position:sticky;top:0;z-index:30;background:#fff;
       border-bottom:4px solid var(--accent)}
  .top-in{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .shop{font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--text);
        display:flex;align-items:center;gap:8px}
  .shop .ball{width:20px;height:20px;flex:0 0 auto}
  .shop small{display:block;font-size:11px;font-weight:700;color:var(--accent);
              letter-spacing:.08em;margin-top:2px}
  .table-badge{background:var(--accent-weak);color:var(--accent);font-size:13px;
               font-weight:800;padding:7px 12px;border-radius:8px;font-variant-numeric:tabular-nums;
               border:1px solid #cddffa}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:15px;
       font-weight:600;padding:10px 12px 12px;position:relative}
  .tab.on{color:var(--accent);font-weight:800}
  .tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;
                 background:var(--accent);border-radius:2px}

  main{padding-bottom:110px}
  .cat-title{font-size:18px;font-weight:800;padding:22px 16px 8px;display:flex;align-items:center;gap:8px}
  .cat-title::before{content:"";width:12px;height:12px;border-radius:50%;
                     background:var(--dirt);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--seam)}
  .item{display:flex;gap:14px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);
        align-items:center;width:100%;text-align:left;background:none}
  .item:active{background:var(--sub)}
  .item .info{flex:1;min-width:0}
  .item .nm{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .item .ds{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .item .pr{font-size:15px;font-weight:800;margin-top:8px}
  .thumb-wrap{position:relative;flex:0 0 auto}
  .thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--sub)}
  .thumb svg{display:block;width:100%;height:100%}
  .badge-qty{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:12px;
             font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;
             place-items:center;padding:0 5px}
  .soldout{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;
           font-size:13px;font-weight:800;color:var(--muted);border-radius:12px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
       border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .cta{width:100%;height:54px;border:0;border-radius:12px;background:var(--accent);color:#fff;
       font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;
       box-shadow:0 3px 0 var(--navy)}
  .cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
  .cta:disabled{box-shadow:none;transform:none}
  .cta:disabled{background:#d7d9df}
  .cta .cnt{background:rgba(255,255,255,.25);min-width:22px;height:22px;border-radius:999px;
            display:grid;place-items:center;font-size:13px;padding:0 6px}

  .dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;
       transition:opacity .2s}
  .dim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
         border-radius:18px 18px 0 0;transform:translateY(100%);
         transition:transform .26s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow:auto;
         padding-bottom:env(safe-area-inset-bottom)}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:#dcdce3;margin:10px auto 2px}
  .sheet-pad{padding:8px 16px 16px}
  .hero{width:100%;height:190px;border-radius:14px;overflow:hidden;background:var(--sub)}
  .hero svg{width:100%;height:100%;display:block}
  .sheet h3{font-size:20px;font-weight:800;margin:16px 0 6px}
  .ds2{font-size:14px;color:var(--muted);line-height:1.5}
  .stepper{display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px}
  .stepper .lbl{font-size:15px;font-weight:700}
  .qtybox{display:flex;align-items:center;gap:8px}
  .qtybox button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
                 background:var(--bg);font-size:20px;line-height:1;color:var(--text)}
  .qtybox button:disabled{color:#c9c9d1}
  .qtybox span{min-width:28px;text-align:center;font-size:17px;font-weight:800;
               font-variant-numeric:tabular-nums}

  .cart-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .cart-row .t{flex:1;min-width:0}
  .nm2{font-size:15px;font-weight:700}
  .pr2{font-size:13px;color:var(--muted);margin-top:3px}
  .sum{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px}
  .sum b{font-size:22px;font-weight:800}
  .fld{margin-top:18px}
  .fld label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  .fld input{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
             background:var(--sub);font-size:16px;color:var(--text)}
  .note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
  .note b{color:var(--accent)}

  .page{display:none;padding:0 16px 40px}
  .page.on{display:block}
  .phead{padding:26px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.4px}
  .psub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
  .k{font-size:13px;color:var(--muted)}
  .v{font-size:19px;font-weight:800;margin-top:6px;word-break:break-all}
  .v.big{font-size:26px}
  .v.accent{color:var(--accent)}
  .copy{margin-top:12px;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
        background:var(--sub);font-size:14px;font-weight:700;color:var(--text)}
  .divide{height:1px;background:var(--line);margin:18px -18px}
  .wait{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--warn)}
  .spin{width:16px;height:16px;border-radius:50%;border:2.5px solid #f1d9b0;
        border-top-color:var(--warn);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lines{font-size:14px;line-height:1.9}
  .lines .r{display:flex;justify-content:space-between}
  .lines .r span:last-child{color:var(--muted)}

  .done-wrap{text-align:center;padding:54px 0 10px}
  .check{width:110px;height:110px;margin:0 auto 20px;
         display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .check svg{width:100%;height:100%;display:block}
  .safe{display:inline-block;background:var(--grass);color:#fff;font-size:15px;font-weight:800;
        letter-spacing:.22em;padding:7px 18px;border-radius:6px;margin-bottom:14px}
  .done-ttl{font-size:26px;font-weight:800;color:var(--ok);letter-spacing:-.5px}
  .done-sub{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.6}
  .ordno{display:inline-block;margin-top:18px;background:var(--sub);border-radius:999px;
         padding:8px 16px;font-size:14px;font-weight:700;color:var(--muted)}
  .board{border:2px solid var(--accent)}
  .bar-track{height:12px;border-radius:99px;background:var(--sub);overflow:hidden;margin-top:12px;
             border:1px solid var(--line)}
  .bar-fill{height:100%;border-radius:99px;width:0%;
            background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 8px,
                       #1160c4 8px,#1160c4 16px);
            transition:width .5s cubic-bezier(.22,1,.36,1)}
  .bar-fill.done{background:repeating-linear-gradient(45deg,var(--grass),var(--grass) 8px,
                 #2a9459 8px,#2a9459 16px)}
  .pay-nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
  .pay-nums .l{font-size:13px;color:var(--muted)}
  .pay-nums .r{font-size:15px;font-weight:800}
  .short{color:#ea580c}
  .hist{margin-top:14px;font-size:13px;line-height:1.9}
  .hist .h{display:flex;justify-content:space-between}
  .hist .h span:last-child{color:var(--muted)}
  .hidden{display:none !important}
</style>
</head>
<body>

<!-- ───── 메뉴 ───── -->
<div id="menuPage">
  <header class="top">
    <div class="top-in">
      <div class="shop">
        <svg class="ball" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#fff" stroke="#c9d6e6" stroke-width="2"/>
          <path d="M8 7q7 13 0 26M32 7q-7 13 0 26" stroke="#d32f2f" stroke-width="2.4" fill="none"/>
        </svg>
        <span>모바일공학전공 주점<small>BALLPARK ORDER</small></span>
      </div>
      <div class="table-badge" id="tableBadge">테이블 확인 중</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="list"></main>
  <div class="bar">
    <button class="cta" id="cartBtn" disabled>
      <span id="cartLabel">메뉴를 담아주세요</span>
      <span class="cnt hidden" id="cartCount">0</span>
    </button>
  </div>
</div>

<!-- ───── 입금 안내 ───── -->
<div class="page" id="payPage">
  <div class="phead">입금해 주세요</div>
  <div class="psub" id="payTable"></div>

  <div class="card board">
    <div class="k">입금자명 — 꼭 이대로 보내주세요</div>
    <div class="v big accent" id="payName">-</div>
    <button class="copy" id="copyName">입금자명 복사</button>
    <div class="note">입력하신 이름 <b>그대로</b> 보내주셔야 자동으로 확인됩니다.</div>
    <div class="divide"></div>
    <div class="k">입금 계좌</div>
    <div class="v" id="payAccount">-</div>
    <button class="copy" id="copyAccount">계좌번호 복사</button>
    <div class="divide"></div>
    <div class="k">보내실 금액</div>
    <div class="v big" id="payAmount">-</div>
  </div>

  <div class="card">
    <div class="wait"><span class="spin"></span><span id="waitText">입금을 기다리는 중…</span></div>

    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="pay-nums">
      <span class="l">들어온 금액</span><span class="r" id="paidNum">0원</span>
    </div>
    <div class="pay-nums">
      <span class="l">남은 금액</span><span class="r short" id="leftNum">-</span>
    </div>

    <div class="hist hidden" id="histBox">
      <div style="font-weight:700;color:var(--text);margin-bottom:2px">입금 내역</div>
      <div id="histList"></div>
    </div>

    <div class="note" id="waitNote">확인되면 소리와 알림으로 알려드려요. <b>이 화면을 닫지 말아 주세요.</b><br>
      나눠서 보내셔도 됩니다 — 합계가 채워지면 자동으로 확인돼요.</div>
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:10px">주문 내역</div>
    <div class="lines" id="payLines"></div>
  </div>
</div>

<!-- ───── 입금 확인 완료 ───── -->
<div class="page" id="donePage">
  <div class="done-wrap">
    <div class="check">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="#fff" stroke="#e2e9f2" stroke-width="3"/>
        <path d="M26 22q18 38 0 76M94 22q-18 38 0 76" stroke="#d32f2f" stroke-width="4" fill="none"/>
        <path d="M40 62l14 14 28-32" stroke="#1e7a46" stroke-width="9" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="safe">SAFE</div>
    <div class="done-ttl">입금 확인 완료</div>
    <div class="done-sub" id="doneSub"></div>
    <div class="ordno" id="doneNo">주문번호 —</div>
  </div>
  <div class="card">
    <div class="k" style="margin-bottom:10px">주문 내역</div>
    <div class="lines" id="doneLines"></div>
  </div>
</div>

<!-- ───── 시트 ───── -->
<div class="dim" id="dim"></div>

<div class="sheet" id="itemSheet">
  <div class="grab"></div>
  <div class="sheet-pad">
    <div class="hero" id="sheetArt"></div>
    <h3 id="sheetName">-</h3>
    <div class="ds2" id="sheetDesc"></div>
    <div class="stepper">
      <span class="lbl">수량</span>
      <span class="qtybox"><button id="sMinus">−</button><span id="sQty">1</span><button id="sPlus">+</button></span>
    </div>
    <button class="cta" id="sAdd" style="margin-top:14px">담기</button>
  </div>
</div>

<div class="sheet" id="cartSheet">
  <div class="grab"></div>
  <div class="sheet-pad">
    <h3 style="margin-top:6px">장바구니</h3>
    <div id="cartList"></div>
    <div class="sum"><span>합계</span><b id="cartTotal">0원</b></div>
    <div class="fld">
      <label for="nameInput">입금자 이름</label>
      <input type="text" id="nameInput" placeholder="예) 홍길동" maxlength="10" autocomplete="name">
      <div class="note" id="nameNote">이름을 입력하면 보내실 입금자명을 알려드려요.</div>
    </div>
    <button class="cta" id="submitBtn" style="margin-top:18px" disabled>주문하고 입금 안내 받기</button>
  </div>
</div>

  cocktailBlue:`<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#e9f1ff"/>
    <path d="M34 36h52L64 64v26h10v6H46v-6h10V64z" fill="#bcd6ff"/>
    <path d="M40 42h40L64 62h-2z" fill="#4f8ef7"/><circle cx="58" cy="50" r="3" fill="#fff" opacity=".8"/>
    <path d="M78 30l-8 12" stroke="#f7a8c4" stroke-width="3" stroke-linecap="round"/></svg>`,
  cocktailPink:`<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#fdecf3"/>
    <path d="M34 36h52L64 64v26h10v6H46v-6h10V64z" fill="#ffd0e2"/>
    <path d="M40 42h40L64 62h-2z" fill="#f2668f"/><circle cx="58" cy="50" r="3" fill="#fff" opacity=".85"/>
    <path d="M78 30l-8 12" stroke="#8fbf6a" stroke-width="3" stroke-linecap="round"/></svg>`,
  cola:`<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#f2eceb"/>
    <path d="M44 34h32v54a8 8 0 0 1-8 8H52a8 8 0 0 1-8-8z" fill="#5c3a32"/>
    <path d="M44 34h32v14H44z" fill="#c7b2ac"/>
    <rect x="50" y="56" width="20" height="22" rx="3" fill="#fff" opacity=".85"/></svg>`,
  cider:`<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#eafaf4"/>
    <path d="M44 34h32v54a8 8 0 0 1-8 8H52a8 8 0 0 1-8-8z" fill="#bfead9"/>
    <path d="M44 34h32v14H44z" fill="#e6f7ef"/><circle cx="54" cy="70" r="3" fill="#fff"/>
    <circle cx="66" cy="78" r="2.5" fill="#fff"/><circle cx="60" cy="62" r="2" fill="#fff"/></svg>`
};

/* 확인용이라 가격은 전부 1원 */
const DEFAULT_MENU = [
  { cat:"추천", name:"사복주",       desc:"사이다 + 복분자주. 사회복지학과 시그니처", price:1, art:"cocktailPink" },
  { cat:"추천", name:"청춘 블루",     desc:"파란 소주 칵테일. 우리 과 시그니처",      price:1, art:"cocktailBlue" },
  { cat:"안주", name:"골뱅이소면",     desc:"새콤달콤 골뱅이무침에 소면 사리",        price:1, art:"noodle" },
  { cat:"안주", name:"계란말이",       desc:"두툼하게 말아낸 계란말이",              price:1, art:"egg" },
  { cat:"안주", name:"과일화채",       desc:"시원한 사이다에 과일 듬뿍",             price:1, art:"fruit" },
  { cat:"안주", name:"마른안주 모둠",   desc:"쥐포, 땅콩, 먹태",                     price:1, art:"dry" },
  { cat:"안주", name:"감자튀김",       desc:"케첩과 함께",                          price:1, art:"fries" },
  { cat:"주류", name:"소주",          desc:"참이슬 / 처음처럼",                     price:1, art:"soju" },
  { cat:"주류", name:"맥주",          desc:"카스 / 테라",                          price:1, art:"beer" },
  { cat:"주류", name:"막걸리",         desc:"생막걸리",                             price:1, art:"makgeolli" },
  { cat:"음료", name:"콜라",          desc:"500ml",                                price:1, art:"cola" },
  { cat:"음료", name:"사이다",         desc:"500ml",                                price:1, art:"cider" }
];

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(location.search);
const tableNo = parseInt(params.get("t") || "0", 10);
let menu = DEFAULT_MENU;
const cart = new Map();
let sheetIdx = -1, sheetQty = 1;
let currentOrder = null, currentOrderId = null, finished = false;

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";
const artOf = m => ART[m.art] || ART.dry;

$("tableBadge").textContent = tableNo > 0 ? `${tableNo}번 테이블` : "번호 없음";

async function loadMenu() {
  try {
    const snap = await get(child(ref(db), "menu"));
    if (snap.exists()) {
      const v = snap.val();
      const list = (Array.isArray(v) ? v : Object.values(v)).filter(Boolean);
      if (list.length) menu = list;
    }
  } catch (e) { console.warn("기본 메뉴 사용", e); }
  render();
}

function render() {
  const cs = [...new Set(menu.map(m => m.cat || "메뉴"))];
  $("tabs").innerHTML = cs.map((c, i) =>
    `<button class="tab${i === 0 ? " on" : ""}" data-cat="${c}">${c}</button>`).join("");
  $("list").innerHTML = cs.map(c => `<section data-sec="${c}">
      <div class="cat-title">${c}</div>
      ${menu.map((m, i) => m.cat === c ? itemHtml(m, i) : "").join("")}
    </section>`).join("");

  $("tabs").onclick = e => {
    const b = e.target.closest(".tab"); if (!b) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
    const sec = document.querySelector(`[data-sec="${b.dataset.cat}"]`);
    window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - 104, behavior:"smooth" });
  };
  $("list").onclick = e => {
    const b = e.target.closest(".item");
    if (b && !b.dataset.soldout) openItem(+b.dataset.i);
  };
  refreshBar();
}

function itemHtml(m, i) {
  const q = cart.get(i) || 0;
  return `<button class="item" data-i="${i}"${m.soldOut ? ' data-soldout="1"' : ""}>
    <div class="info">
      <div class="nm">${m.name}</div>
      ${m.desc ? `<div class="ds">${m.desc}</div>` : ""}
      <div class="pr">${won(m.price)}</div>
    </div>
    <div class="thumb-wrap">
      <div class="thumb">${artOf(m)}</div>
      ${q ? `<span class="badge-qty">${q}</span>` : ""}
      ${m.soldOut ? `<div class="soldout">품절</div>` : ""}
    </div></button>`;
}

function repaintBadges() {
  document.querySelectorAll(".item").forEach(el => {
    const q = cart.get(+el.dataset.i) || 0;
    const w = el.querySelector(".thumb-wrap");
    let b = w.querySelector(".badge-qty");
    if (q) { if (!b) { b = document.createElement("span"); b.className = "badge-qty"; w.appendChild(b); } b.textContent = q; }
    else if (b) b.remove();
  });
}

function openItem(i) {
  sheetIdx = i; sheetQty = cart.get(i) || 1;
  const m = menu[i];
  $("sheetArt").innerHTML = artOf(m);
  $("sheetName").textContent = m.name;
  $("sheetDesc").textContent = m.desc || "";
  setSheetQty(sheetQty);
  openSheet("itemSheet");
}
$("sPlus").onclick = () => setSheetQty(sheetQty + 1);
$("sMinus").onclick = () => setSheetQty(sheetQty - 1);
function setSheetQty(q) {
  sheetQty = Math.max(1, Math.min(99, q));
  $("sQty").textContent = sheetQty;
  $("sMinus").disabled = sheetQty <= 1;
  $("sAdd").textContent = `${won(menu[sheetIdx].price * sheetQty)} 담기`;
}
$("sAdd").onclick = () => { cart.set(sheetIdx, sheetQty); closeSheets(); repaintBadges(); refreshBar(); };

function openSheet(id) { $("dim").classList.add("on"); $(id).classList.add("on"); }
function closeSheets() {
  $("dim").classList.remove("on");
  $("itemSheet").classList.remove("on");
  $("cartSheet").classList.remove("on");
}
$("dim").onclick = closeSheets;

function total() { let t = 0; cart.forEach((q, i) => t += menu[i].price * q); return t; }
function count() { let c = 0; cart.forEach(q => c += q); return c; }

function refreshBar() {
  const c = count();
  $("cartBtn").disabled = c === 0;
  $("cartCount").classList.toggle("hidden", c === 0);
  $("cartCount").textContent = c;
  $("cartLabel").textContent = c === 0 ? "메뉴를 담아주세요" : `${won(total())} · 장바구니 보기`;
}
$("cartBtn").onclick = () => { renderCart(); openSheet("cartSheet"); };

function renderCart() {
  const rows = [];
  cart.forEach((q, i) => {
    const m = menu[i];
    rows.push(`<div class="cart-row" data-i="${i}">
      <div class="thumb" style="width:52px;height:52px">${artOf(m)}</div>
      <div class="t"><div class="nm2">${m.name}</div><div class="pr2">${won(m.price * q)}</div></div>
      <span class="qtybox"><button data-d="-1">−</button><span>${q}</span><button data-d="1">+</button></span>
    </div>`);
  });
  $("cartList").innerHTML = rows.join("");
  $("cartTotal").textContent = won(total());
  $("cartList").onclick = e => {
    const b = e.target.closest("button[data-d]"); if (!b) return;
    const i = +b.closest(".cart-row").dataset.i;
    const q = (cart.get(i) || 0) + (+b.dataset.d);
    q <= 0 ? cart.delete(i) : cart.set(i, q);
    renderCart(); repaintBadges(); refreshBar();
    if (count() === 0) closeSheets();
  };
  checkName();
}

function depositorName() {
  // 입금자명은 이름 그대로. 테이블 번호는 주문에만 기록하고 이름에는 안 붙인다.
  return $("nameInput").value.trim().replace(/\s+/g, "");
}
function checkName() {
  const n = depositorName();
  $("nameNote").innerHTML = n ? `입금자명을 <b>${n}</b> 으로 보내주세요.`
                              : "입금할 때 쓸 이름을 그대로 적어주세요.";
  $("submitBtn").disabled = !(total() > 0 && n.length >= 2 && tableNo > 0);
}
$("nameInput").addEventListener("input", checkName);

$("submitBtn").onclick = async () => {
  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "보내는 중…";

  try {
    if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
  } catch (e) {}

  const items = [];
  cart.forEach((q, i) => items.push({ name: menu[i].name, qty: q, price: menu[i].price }));
  const order = {
    tableNo, customerName: $("nameInput").value.trim(), depositorName: depositorName(),
    amount: total(), items, status: "WAITING", createdAt: Date.now()
  };

  try {
    const r = push(ref(db, "orders"));
    await set(r, order);
    currentOrder = order; currentOrderId = r.key;
    try { localStorage.setItem("jujeom_order_id", r.key); } catch (e) {}
    showPay();
  } catch (e) {
    console.error(e);
    alert("주문을 보내지 못했어요. 와이파이를 확인하고 다시 눌러주세요.");
    btn.disabled = false; btn.textContent = "주문하고 입금 안내 받기";
  }
};

function lineHtml(o) {
  return o.items.map(i =>
    `<div class="r"><span>${i.name} × ${i.qty}</span><span>${won(i.price * i.qty)}</span></div>`).join("")
    + `<div class="r" style="margin-top:6px;font-weight:800"><span>합계</span><span style="color:inherit">${won(o.amount)}</span></div>`;
}

function showPay() {
  closeSheets();
  $("menuPage").classList.add("hidden");
  $("payPage").classList.add("on");
  window.scrollTo(0, 0);

  const o = currentOrder;
  $("payTable").textContent = `${o.tableNo}번 테이블 · 메뉴 ${o.items.reduce((a, b) => a + b.qty, 0)}개`;
  $("payName").textContent = o.depositorName;
  $("payAccount").textContent = `${ACCOUNT_BANK} ${ACCOUNT_NO} (예금주 ${ACCOUNT_NAME})`;
  $("payAmount").textContent = won(o.amount);
  $("payLines").innerHTML = lineHtml(o);
  copyBtn($("copyName"), o.depositorName, "입금자명 복사");
  copyBtn($("copyAccount"), ACCOUNT_NO, "계좌번호 복사");

  setTimeout(() => {
    if (!finished) $("waitNote").innerHTML =
      '<b style="color:#d97706">5분이 지났어요.</b> 입금자명이 위와 같은지 확인해 보시고, 그래도 안 되면 직원에게 말씀해 주세요.';
  }, 5 * 60 * 1000);

  // 주문 전체를 구독한다 — 상태뿐 아니라 얼마가 들어왔는지까지 실시간으로 받는다
  onValue(ref(db, "orders/" + currentOrderId), snap => {
    const v = snap.val();
    if (!v) return;
    renderPayProgress(v);

    const st = v.status;
    if (st === "PAID" || st === "COOKING" || st === "SERVED") showDone(v);
    else if (st === "PARTIAL") $("waitText").textContent = "일부만 확인됐어요. 남은 금액을 보내주세요.";
    else if (st === "REVIEW") $("waitText").textContent = "확인 중이에요. 잠시만 기다려 주세요.";
    else if (st === "CANCELED") $("waitText").textContent = "취소된 주문이에요. 직원에게 문의해 주세요.";
    else $("waitText").textContent = "입금을 기다리는 중…";
  });
}

/** 얼마 들어왔고 얼마 남았는지 그린다 */
function renderPayProgress(v) {
  const total = v.amount || 0;
  const paid = v.paidAmount || 0;
  const left = Math.max(0, total - paid);
  const pct = total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0;

  const fill = $("barFill");
  fill.style.width = pct + "%";
  fill.classList.toggle("done", left === 0 && paid > 0);

  $("paidNum").textContent = won(paid);
  if (left === 0 && paid > 0) {
    $("leftNum").textContent = "다 보내셨어요";
    $("leftNum").classList.remove("short");
  } else {
    $("leftNum").textContent = won(left) + " 더 보내주세요";
    $("leftNum").classList.add("short");
  }

  const list = v.payments ? Object.values(v.payments) : [];
  if (list.length) {
    list.sort((a, b) => (a.at || 0) - (b.at || 0));
    $("histBox").classList.remove("hidden");
    $("histList").innerHTML = list.map(p => {
      const t = p.at ? new Date(p.at).toLocaleTimeString("ko-KR",
        { hour: "2-digit", minute: "2-digit" }) : "";
      return `<div class="h"><span>${won(p.amount || 0)} 입금</span><span>${t}</span></div>`;
    }).join("");
  } else {
    $("histBox").classList.add("hidden");
  }
}

function copyBtn(btn, text, label) {
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "복사했어요 ✓"; }
    catch (e) { btn.textContent = text; }
    setTimeout(() => btn.textContent = label, 1800);
  };
}

function showDone(v) {
  if (finished) return;
  finished = true;
  if (v && v.paidAmount) currentOrder.paidAmount = v.paidAmount;
  $("payPage").classList.remove("on");
  $("donePage").classList.add("on");
  window.scrollTo(0, 0);

  const o = currentOrder;
  $("doneNo").textContent = "주문번호 " + String(currentOrderId || "").slice(-6).toUpperCase();
  const over = (o.paidAmount || 0) - o.amount;
  $("doneSub").innerHTML = `${o.tableNo}번 테이블 · ${won(o.amount)}`
    + (over > 0 ? ` <span style="color:#2563eb">(${won(over)} 더 보내셨어요 — 직원에게 말씀해 주세요)</span>` : "")
    + `<br>주문이 주방으로 들어갔어요. 잠시만 기다려 주세요.`;
  $("doneLines").innerHTML = lineHtml(o);
  document.title = "입금 확인 완료";

  try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach((t, i) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.connect(g); g.connect(ac.destination);
      osc.frequency.value = i === 0 ? 880 : 1320;
      g.gain.setValueAtTime(0.001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.16);
      osc.start(ac.currentTime + t); osc.stop(ac.currentTime + t + 0.18);
    });
  } catch (e) {}
  try {
    if ("Notification" in window && Notification.permission === "granted")
      new Notification("입금 확인 완료!", { body:`${o.tableNo}번 테이블 · 주문이 주방으로 들어갔어요`, tag:"jujeom-paid" });
  } catch (e) {}
}

loadMenu();
</script>
</body>
</html>
